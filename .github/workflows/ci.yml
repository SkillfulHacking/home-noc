# .github/workflows/ci.yml
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.txt
            backend/requirements.lock

      - name: Install deps
        run: |
          python -m pip install --only-binary=:all: --upgrade pip==26.3
          pip install --only-binary=:all: --require-hashes -r requirements.lock
          pip install --only-binary=:all: pytest==9.2.0 pytest-cov==7.1.0 ruff==0.17.6

      - name: Lint
        run: ruff check .

      - name: Clean test DB
        run: rm -f test.db

      - name: Tests
        env:
          APP_ENV: test
          DB_URL: sqlite:///./test.db   # file-backed sqlite so tables persist across connections
          PYTHONPATH: .
        run: pytest -q

      - name: Dependency audit
        run: |
          pip install --only-binary=:all: pip-audit==2.10.1
          pip-audit -r requirements.lock

      - name: Docker build
        run: docker build --pull -t home-noc-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Docker build
        run: docker build --pull -t home-noc-frontend:ci .

  image-scan:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build --pull -t home-noc-api:ci ./backend

      - name: Build frontend image
        run: docker build --pull -t home-noc-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: home-noc-api:ci
          version: "v0.76.2"
          severity: "CRITICAL,HIGH"
          scanners: "vuln"
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: home-noc-frontend:ci
          version: "v0.76.2"
          severity: "CRITICAL,HIGH"
          scanners: "vuln"
          ignore-unfixed: true
          exit-code: "1"

  e2e-smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      HOME_NOC_BACKEND_BIND: "18000"
      HOME_NOC_FRONTEND_BIND: "18080"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare ephemeral backend environment
        # Starts from the tracked example file only -- never a real/local
        # .env -- and injects a random admin password plus its PBKDF2-SHA256
        # verifier. Both exist only for the lifetime of this CI job. Only the
        # verifier is written to the env file; the password is masked and
        # handed to later steps via GITHUB_ENV. Neither is ever echoed.
        # SESSION_COOKIE_SECURE=false is set for this isolated, plain-HTTP
        # loopback job only; the production default (Secure) is unchanged.
        env:
          ENV_FILE: ${{ runner.temp }}/home-noc.env
        run: |
          umask 077
          cp backend/.env.example "$ENV_FILE"
          python3 - <<'PY'
          import base64, hashlib, os, secrets

          password = secrets.token_urlsafe(24)
          # Mask before anything could possibly log it.
          print(f"::add-mask::{password}")
          iterations = 600_000
          salt = secrets.token_bytes(16)
          digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, iterations)
          b64 = lambda raw: base64.b64encode(raw).decode("ascii")
          verifier = f"pbkdf2_sha256${iterations}${b64(salt)}${b64(digest)}"
          print(f"::add-mask::{verifier}")

          # Single quotes: Compose env_file would otherwise interpolate the
          # '$' separators in the verifier.
          with open(os.environ["ENV_FILE"], "a", encoding="utf-8") as fh:
              fh.write("\nADMIN_USERNAME=admin\n")
              fh.write(f"ADMIN_PASSWORD_HASH='{verifier}'\n")
              fh.write("SESSION_COOKIE_SECURE=false\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as fh:
              fh.write(f"HOME_NOC_ADMIN_PASSWORD={password}\n")
          PY
          echo "HOME_NOC_ENV_FILE=${ENV_FILE}" >> "$GITHUB_ENV"

      - name: Build stack images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend and frontend health
        run: |
          wait_healthy() {
            svc="$1"
            for _ in $(seq 1 30); do
              cid=$(docker compose ps -q "$svc")
              status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::$svc did not become healthy in time"
            return 1
          }
          wait_healthy backend || exit 1
          wait_healthy frontend || exit 1

      - name: Proxy and auth smoke test
        run: |
          HOME_NOC_BASE_URL="http://127.0.0.1:${HOME_NOC_FRONTEND_BIND}" \
          HOME_NOC_ADMIN_USERNAME=admin \
            ./scripts/compose-smoke-test.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
