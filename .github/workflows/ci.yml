# .github/workflows/ci.yml
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.txt
            backend/requirements.lock

      - name: Install deps
        run: |
          python -m pip install --only-binary=:all: --upgrade pip==26.3
          pip install --only-binary=:all: --require-hashes -r requirements.lock
          pip install --only-binary=:all: pytest==9.2.0 pytest-cov==7.1.0 ruff==0.17.6

      - name: Lint
        run: ruff check .

      - name: Clean test DB
        run: rm -f test.db

      - name: Tests
        env:
          APP_ENV: test
          DB_URL: sqlite:///./test.db   # file-backed sqlite so tables persist across connections
          PYTHONPATH: .
        run: pytest -q

      - name: Dependency audit
        run: |
          pip install --only-binary=:all: pip-audit==2.10.1
          pip-audit -r requirements.lock

      - name: Docker build
        run: docker build --pull -t home-noc-api:ci .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Docker build
        run: docker build --pull -t home-noc-frontend:ci .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ShellCheck is preinstalled on GitHub's ubuntu runners.
      - name: ShellCheck operator scripts
        run: |
          shellcheck --version
          # M07 scripts: every finding, including style, fails the build.
          shellcheck --shell=bash --external-sources \
            scripts/bootstrap.sh \
            scripts/backup.sh \
            scripts/restore.sh \
            scripts/ci-restore-integration.sh
          # Claude issue runner: all ShellCheck findings block CI.
          shellcheck --shell=bash --external-sources scripts/claude-issue.sh
          # Older scripts: warnings and errors only.
          shellcheck --severity=warning --external-sources \
            scripts/compose-smoke-test.sh \
            backend/entrypoint.sh

      - name: Claude issue runner offline integration tests
        run: |
          bash -n scripts/claude-issue.sh
          python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  image-scan:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build backend image
        run: docker build --pull -t home-noc-api:ci ./backend

      - name: Build frontend image
        run: docker build --pull -t home-noc-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: home-noc-api:ci
          version: "v0.76.2"
          severity: "CRITICAL,HIGH"
          scanners: "vuln"
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: home-noc-frontend:ci
          version: "v0.76.2"
          severity: "CRITICAL,HIGH"
          scanners: "vuln"
          ignore-unfixed: true
          exit-code: "1"

  e2e-smoke:
    needs: [backend, frontend, shellcheck]
    runs-on: ubuntu-latest
    env:
      # The backend is not published on the host; only the frontend is, and only
      # on loopback (the same safe default as docker-compose.yml).
      HOME_NOC_FRONTEND_BIND: "127.0.0.1:18080"
      HOME_NOC_BASE_URL: "http://127.0.0.1:18080"
      # Disposable, uniquely named project: its containers, network, volume and
      # images cannot collide with any other stack, and the "home-noc-ci-"
      # prefix is what scripts/ci-restore-integration.sh insists on.
      COMPOSE_PROJECT_NAME: home-noc-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare ephemeral backend environment
        # Starts from the tracked example file only -- never a real/local
        # .env -- and injects a random admin password plus its PBKDF2-SHA256
        # verifier. Both exist only for the lifetime of this CI job. Only the
        # verifier is written to the env file; the password is masked and
        # handed to later steps via GITHUB_ENV. Neither is ever echoed.
        # SESSION_COOKIE_SECURE=false is set for this isolated, plain-HTTP
        # loopback job only; the production default (Secure) is unchanged.
        env:
          ENV_FILE: ${{ runner.temp }}/home-noc.env
        run: |
          umask 077
          cp backend/.env.example "$ENV_FILE"
          python3 scripts/ci-generate-auth.py
          echo "HOME_NOC_ENV_FILE=${ENV_FILE}" >> "$GITHUB_ENV"
          # Disposable credential encryption key, written straight to a file
          # (never printed). 0444 inside a 0700 directory so UID 10001 can read
          # the bind-mounted secret.
          KEY_DIR="${RUNNER_TEMP}/home-noc-secrets"
          mkdir -p -m 700 "$KEY_DIR"
          python3 -c 'import base64,secrets;print(base64.urlsafe_b64encode(secrets.token_bytes(32)).decode())' > "$KEY_DIR/credential_key"
          chmod 444 "$KEY_DIR/credential_key"
          echo "HOME_NOC_CREDENTIAL_KEY_FILE=${KEY_DIR}/credential_key" >> "$GITHUB_ENV"
          echo "HOME_NOC_BACKUP_DIR=${RUNNER_TEMP}/home-noc-backups" >> "$GITHUB_ENV"

      - name: Build stack images
        run: docker compose build

      - name: Start stack
        run: docker compose up -d

      - name: Wait for backend and frontend health
        run: |
          wait_healthy() {
            svc="$1"
            for _ in $(seq 1 30); do
              cid=$(docker compose ps -q "$svc")
              status=$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                return 0
              fi
              sleep 5
            done
            echo "::error::$svc did not become healthy in time"
            return 1
          }
          wait_healthy backend || exit 1
          wait_healthy frontend || exit 1

      - name: Proxy and auth smoke test
        run: |
          HOME_NOC_ADMIN_USERNAME=admin \
            ./scripts/compose-smoke-test.sh

      - name: Backup, restore and hardening integration
        # Real API write -> online backup -> down (volume kept) -> refused and
        # wrong-key restores -> real restore -> restart -> data verified, plus
        # UID 10001 / read-only rootfs / unpublished backend port. Uses only the
        # disposable password, key and volume created above; prints no secret.
        env:
          HOME_NOC_ADMIN_USERNAME: admin
        run: bash scripts/ci-restore-integration.sh

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down stack
        if: always()
        run: docker compose down -v
