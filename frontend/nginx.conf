server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # React router history fallback
  location / {
    try_files $uri /index.html;
  }

  # /health and /version live outside the backend's /api/v1 prefix, so proxy
  # them explicitly instead of letting the generic /api/ rule strip /api/.
  location = /api/health {
    proxy_pass http://backend:8000/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/version {
    proxy_pass http://backend:8000/version;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # API proxy -> backend service inside compose network.
  # proxy_pass has no URI component here, so nginx forwards the full,
  # unmodified request path (e.g. /api/v1/devices) instead of stripping
  # the /api/ prefix that the backend's routers expect.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
