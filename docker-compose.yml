# docker-compose.yml
#
# Project name: fixed so the data volume (<project>_api_data) does not change
# when the checkout directory is renamed or moved. COMPOSE_PROJECT_NAME (or
# `docker compose -p`) overrides it, which is how development, test and
# production stacks on one host stay separate: containers, networks, volumes
# AND built images are all namespaced by the project name.
#
# Deliberately absent: `container_name` (a fixed name collides between projects)
# and `image:` (a fixed tag such as home-noc-api:latest would be shared and
# silently overwritten by whichever project built last). Without `image:`,
# Compose tags builds as <project>-<service>.
name: home-noc

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: api
    # No CORS_ORIGINS here: the frontend container reaches the backend
    # through Nginx on the same origin (see frontend/nginx.conf), so no
    # cross-origin requests -- and therefore no CORS config -- are needed
    # in this Compose deployment.
    restart: unless-stopped
    env_file:
      # Generated by scripts/bootstrap.sh (untracked). Compose refuses to start
      # without it, so a missing admin verifier can never yield an open API.
      - "${HOME_NOC_ENV_FILE:-backend/.env}"
    environment:
      # The encryption key is mounted read-only from outside the data volume
      # (see `secrets` below); it is never part of the image, env file or DB.
      CREDENTIAL_ENCRYPTION_KEY_FILE: /run/secrets/home_noc_credential_key
    secrets:
      - home_noc_credential_key
    # The backend is deliberately NOT published on the host. Only the frontend
    # reaches it, over the Compose network. For development, opt in with
    # docker-compose.dev.yml.
    expose:
      - "8000"
    user: "10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - api_data:/data
    healthcheck:
      # /health returns 503 when the database is unreachable or unmigrated.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Scan/poll worker (M09). Same image source as the API but a separate,
  # unprivileged container that carries the scanner and publishes no port.
  # It shares only the SQLite volume; jobs are leased through the database.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - "${HOME_NOC_ENV_FILE:-backend/.env}"
    # No credential-encryption key: the worker never decrypts connector secrets.
    user: "10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
      - /run/home-noc:rw,noexec,nosuid,nodev,size=1m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    stop_grace_period: 30s
    volumes:
      - api_data:/data
    depends_on:
      backend:
        # The backend applies migrations before it reports healthy.
        condition: service_healthy
    healthcheck:
      # The worker touches this file on every poll cycle.
      # `find` exits 0 even when nothing matches, so test its output.
      test: ["CMD-SHELL", "test -n \"$$(find /run/home-noc/worker-heartbeat -mmin -1 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEFAULT_API_BASE: "/api"
    restart: unless-stopped
    ports:
      # Loopback only by default: the bundled Nginx speaks plain HTTP, so it is
      # not exposed to the network unless the operator asks. For LAN access set
      # HOME_NOC_FRONTEND_BIND=0.0.0.0:3000 (or a specific LAN address:3000) and
      # prefer TLS in front (docs/installation.md, "Network exposure").
      - "${HOME_NOC_FRONTEND_BIND:-127.0.0.1:3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    cap_drop:
      - ALL
    cap_add:
      # Minimum for the stock nginx image: bind :80, drop to the worker user.
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # Confirms Nginx is routing /api/* to the backend, not just serving
      # static assets.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

secrets:
  home_noc_credential_key:
    # Created once by scripts/bootstrap.sh. Keep it out of Git and out of the
    # SQLite volume, and back it up separately from database backups.
    file: "${HOME_NOC_CREDENTIAL_KEY_FILE:-./secrets/credential_key}"

volumes:
  # Holds only the SQLite database. `docker compose down -v` DELETES it.
  api_data:
