[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "home-noc-backend"
version = "0.1.0"
description = "Home-NOC FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Home-NOC" }]
license = "MIT"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "cryptography==50.0.2",
  "orjson==3.13.0",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "httpx==0.28.1",
  "ruff==0.17.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "alembic*", "scripts*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E","F","W","B","UP","I","S"]
ignore = ["S110"]  # env parsing try/except/pass

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]          # allow asserts in tests
"alembic/**" = ["E402","I001"] # path hack/import order in env.py
"app/api/**" = ["B008"]        # FastAPI-style Depends/Query defaults
